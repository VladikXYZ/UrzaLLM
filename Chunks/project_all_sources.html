<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>All sources map</title>
<style>
:root{--bg:#f9f9f7;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--line:#e4e3df;
 --s0:#2a78d6;--s1:#eb6834;--s2:#1baf7a;--s3:#8b5cc8;--hl:#0b0b0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--line:#383835;
 --s0:#3987e5;--s1:#d95926;--s2:#199e70;--s3:#a98ae6;--hl:#f0efec}}
:root[data-theme="dark"]{--bg:#0d0d0d;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--line:#383835;
 --s0:#3987e5;--s1:#d95926;--s2:#199e70;--s3:#a98ae6;--hl:#f0efec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 4px} p.sub{color:var(--ink2);margin:0 0 16px;max-width:900px}
.controls{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:0 0 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--card);color:var(--ink);border:0;padding:6px 12px;cursor:pointer;font:inherit}
.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--ink);color:var(--bg)}
.lg{display:inline-flex;gap:14px;flex-wrap:wrap;font-size:13px;align-items:center}
.lg label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;vertical-align:-1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.ph{display:flex;align-items:center;gap:8px;margin:0 0 8px}.ph h2{font-size:15px;margin:0;flex:1}
.ph button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 9px;cursor:pointer;font:inherit;font-size:13px}
.cw{position:relative}.zoomlab{position:absolute;left:6px;bottom:4px;font-size:11px;color:var(--ink2);pointer-events:none}
canvas{width:100%;aspect-ratio:1/1;display:block;cursor:grab;touch-action:none}
#tip{position:fixed;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;
 padding:8px 10px;font-size:12.5px;max-width:360px;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none;z-index:9}
#tip .t{font-weight:600;margin-bottom:2px}#tip .m{color:var(--ink2)}
h2.sec{font-size:17px;margin:28px 0 6px}
p.cap{color:var(--ink2);font-size:13px;margin:8px 2px 0;max-width:900px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>All sources on one map</h1>
<p class="sub">Urza's articles, book paragraphs, video descriptions and the video transcripts, mapped together.</p>
<div class="seg" id="model"></div>

<h2 class="sec">The maps</h2>
<div class="controls">
 <span class="lg" id="legend"></span>
 <div class="seg" id="lbl"><button data-l="on" class="on">Chapter labels</button><button data-l="off">No labels</button></div>
</div>
<div class="grid">
 <div class="panel"><div class="ph"><h2>Raw vectors</h2><button data-z="0" data-d="1">+</button><button data-z="0" data-d="-1">−</button><button data-z="0" data-d="0">Whole map</button></div>
  <div class="cw"><canvas id="c0"></canvas><span class="zoomlab" id="z0"></span></div></div>
 <div class="panel"><div class="ph"><h2>Each source's average removed</h2><button data-z="1" data-d="1">+</button><button data-z="1" data-d="-1">−</button><button data-z="1" data-d="0">Whole map</button></div>
  <div class="cw"><canvas id="c1"></canvas><span class="zoomlab" id="z1"></span></div></div>
</div>
<p class="cap" id="capmap"></p>
</div>
<div id="tip"></div>
<script>
__LABEL_JS__
const META=__META__;
const D=__DATA__;
const SRC=["article","book","video","transcription"],
 SL={article:"Articles",book:"Book paragraphs",video:"Video descriptions",transcription:"Video transcripts"},
 ONE={article:"Article",book:"Book paragraph",video:"Video description",transcription:"Video transcript"};
const N=D.lab.length, n=x=>x.toLocaleString("en"), C=META.counts, V=["raw","cen"];
const css=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
let model=META.models[0][0], hover=-1, labels=true; const show=[true,true,true,true];
const Z=[{k:1,x:0,y:0},{k:1,x:0,y:0}];          // per map: zoom factor and offset (CSS px)

document.getElementById("legend").innerHTML=SRC.map((s,i)=>`<label><input type="checkbox" data-i="${i}" checked><span class="sw" style="background:var(--s${i})"></span>${SL[s]} (${n(C[s])})</label>`).join("");
document.querySelectorAll("#legend input").forEach(c=>c.onchange=()=>{show[+c.dataset.i]=c.checked;draw();});
const mseg=document.getElementById("model");
mseg.innerHTML=META.models.map(([k,l],i)=>`<button data-m="${k}"${i?"":" class=on"}>${l}</button>`).join("");
mseg.querySelectorAll("button").forEach(b=>b.onclick=()=>setModel(b.dataset.m));
window.setModel=m=>{if(!D.xy[m+"_raw"])return;model=m;GEO=[null,null];Z.forEach(z=>{z.k=1;z.x=0;z.y=0;});
 mseg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));draw();};

// geometry: coordinates (int /10000), fitted to the 0.1-99.9 percentile box, far points pinned to the edge
const cv=[0,1].map(i=>document.getElementById("c"+i));
const BOUND={};
function bound(k){if(BOUND[k])return BOUND[k];const a=D.xy[k],xs=new Float32Array(N),ys=new Float32Array(N);
 for(let i=0;i<N;i++){xs[i]=a[2*i];ys[i]=a[2*i+1];}
 const sx=Float32Array.from(xs).sort(),sy=Float32Array.from(ys).sort(),q=(s,p)=>s[Math.floor(p*(N-1))];
 return BOUND[k]={xs,ys,b:[q(sx,.001),q(sx,.999),q(sy,.001),q(sy,.999)]};}
function geom(ci,w){const B=bound(model+"_"+V[ci]),b=B.b,pad=8,s=Math.min((w-2*pad)/(b[1]-b[0]),(w-2*pad)/(b[3]-b[2])),
 ox=(w-(b[1]-b[0])*s)/2,oy=(w-(b[3]-b[2])*s)/2,X=new Float32Array(N),Y=new Float32Array(N);
 for(let i=0;i<N;i++){X[i]=ox+(Math.max(b[0],Math.min(b[1],B.xs[i]))-b[0])*s;Y[i]=w-oy-(Math.max(b[2],Math.min(b[3],B.ys[i]))-b[2])*s;}
 const G=24,cell=w/G,grid=Array.from({length:G*G},()=>[]);
 for(let i=0;i<N;i++){const gx=Math.min(G-1,Math.max(0,Math.floor(X[i]/cell))),gy=Math.min(G-1,Math.max(0,Math.floor(Y[i]/cell)));grid[gy*G+gx].push(i);}
 const CH=META.chapters.map(c=>{let x=0,y=0;for(const i of c.members){x+=B.xs[i];y+=B.ys[i];}x/=c.members.length;y/=c.members.length;
  return [ox+(Math.max(b[0],Math.min(b[1],x))-b[0])*s, w-oy-(Math.max(b[2],Math.min(b[3],y))-b[2])*s];});
 return {X,Y,w,G,cell,grid,CH};}
let GEO=[null,null];
// order: transcripts first (underneath), then descriptions, articles, books; random within to avoid stripes
const ORDER=(()=>{const o=[...Array(N).keys()];const rank=[2,3,1,0];let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const key=o.map(i=>rank[D.lab[i]]*2+r());return o.sort((a,b)=>key[a]-key[b]);})();
function draw(){
 const sc=SRC.map((_,i)=>css("--s"+i)),ink=css("--hl"),bg=css("--card");
 cv.forEach((c,ci)=>{const dpr=window.devicePixelRatio||1,w=c.clientWidth;
  if(!GEO[ci]||GEO[ci].w!==w)GEO[ci]=geom(ci,w);
  const {X,Y}=GEO[ci],z=Z[ci],k=z.k;c.width=w*dpr;c.height=w*dpr;const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,w);
  const grow=Math.min(2.2,Math.sqrt(k));
  for(const i of ORDER){const l=D.lab[i];if(!show[l])continue;const x=X[i]*k+z.x,y=Y[i]*k+z.y;if(x<-3||y<-3||x>w+3||y>w+3)continue;
   const tr=l===3;g.globalAlpha=tr?0.3:0.85;g.fillStyle=sc[l];const r=(tr?1.1:1.8)*grow;g.fillRect(x-r,y-r,2*r,2*r);}
  g.globalAlpha=1;
  if(hover>=0){const x=X[hover]*k+z.x,y=Y[hover]*k+z.y;g.strokeStyle=ink;g.lineWidth=2.5;g.fillStyle=bg;g.beginPath();g.arc(x,y,6,0,7);g.fill();g.stroke();
   g.fillStyle=sc[D.lab[hover]];g.beginPath();g.arc(x,y,3.5,0,7);g.fill();}
  if(labels){const CH=GEO[ci].CH;g.setTransform(1,0,0,1,0,0);
   const L=[];META.chapters.forEach((c,j)=>{const x=(CH[j][0]*k+z.x)*dpr,y=(CH[j][1]*k+z.y)*dpr;if(x<0||y<0||x>w*dpr||y>w*dpr)return;
    g.fillStyle=ink;g.beginPath();g.arc(x,y,3*dpr,0,7);g.fill();g.strokeStyle=bg;g.lineWidth=1*dpr;g.stroke();
    L.push({x,y,text:c.label.length>34?c.label.slice(0,32).replace(/\s+\S*$/,"")+"…":c.label,r:3*dpr,bold:true});});
   placeLabels(g,L,dpr,bg,ink,css("--lead")||"#8a8984",{size:10.5});}
  document.getElementById("z"+ci).textContent=k>1.01?`zoom ×${k.toFixed(1)} · double-click for the whole map`:"scroll to zoom, drag to move";
 });
 document.getElementById("capmap").innerHTML=`One dot per chunk (${n(N)}), the same chunk marked on both maps on hover; click a dot to open its source (transcripts: that moment of the video).`
  +(labels?` Labels: book chapters, each at the centre of its paragraphs.`:"");
}
const tip=document.getElementById("tip"),mmss=t=>`${Math.floor(t/3600)?Math.floor(t/3600)+":":""}${String(Math.floor(t/60)%60).padStart(Math.floor(t/3600)?2:1,"0")}:${String(t%60).padStart(2,"0")}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function nearest(ci,e){const G=GEO[ci];if(!G)return -1;const r=cv[ci].getBoundingClientRect(),z=Z[ci],
 mx=(e.clientX-r.left-z.x)/z.k,my=(e.clientY-r.top-z.y)/z.k,rad=7/z.k;
 let best=-1,bd=rad*rad;const gx=Math.floor(mx/G.cell),gy=Math.floor(my/G.cell);
 for(let y=gy-1;y<=gy+1;y++)for(let x=gx-1;x<=gx+1;x++){if(x<0||y<0||x>=G.G||y>=G.G)continue;
  for(const i of G.grid[y*G.G+x]){if(!show[D.lab[i]])continue;const dx=G.X[i]-mx,dy=G.Y[i]-my,dd=dx*dx+dy*dy;if(dd<bd){bd=dd;best=i;}}}
 return best;}
function zoomAt(ci,f,px,py){const z=Z[ci],w=cv[ci].clientWidth,k=Math.max(1,Math.min(40,z.k*f));
 if(px===undefined){px=w/2;py=w/2;}
 z.x=px-(px-z.x)*(k/z.k);z.y=py-(py-z.y)*(k/z.k);z.k=k;
 if(k===1){z.x=0;z.y=0;}draw();}
let drag=null;
cv.forEach((c,ci)=>{
 c.addEventListener("wheel",e=>{e.preventDefault();const r=c.getBoundingClientRect();zoomAt(ci,Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
 c.addEventListener("pointerdown",e=>{drag={ci,x:e.clientX,y:e.clientY,zx:Z[ci].x,zy:Z[ci].y,moved:false};c.setPointerCapture(e.pointerId);});
 c.addEventListener("pointerup",e=>{const d=drag;drag=null;c.style.cursor="grab";
  if(d&&!d.moved){const i=nearest(ci,e);if(i<0)return;const u=D.urls[D.doc[i]];if(!u)return;
   window.open(D.tm[i]>=0?u+(u.includes("?")?"&":"?")+"t="+D.tm[i]+"s":u,"_blank","noopener");}});
 c.addEventListener("dblclick",()=>{Z[ci].k=1;Z[ci].x=0;Z[ci].y=0;draw();});
 c.addEventListener("pointermove",e=>{
  if(drag&&drag.ci===ci){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
   if(drag.moved&&Z[ci].k>1){Z[ci].x=drag.zx+dx;Z[ci].y=drag.zy+dy;c.style.cursor="grabbing";tip.style.display="none";draw();return;}}
  const best=nearest(ci,e);
  if(best!==hover){hover=best;draw();}
  if(best<0){tip.style.display="none";return;}
  c.style.cursor=D.urls[D.doc[best]]?"pointer":"grab";
  const s=SRC[D.lab[best]];tip.innerHTML=`<div class="t">${esc(D.titles[D.doc[best]])}</div><div class="m"><span class="sw" style="background:var(--s${D.lab[best]})"></span> ${ONE[s]}${D.tm[best]>=0?" at "+mmss(D.tm[best]):""}</div><div>${esc(D.snip[best])}${D.snip[best].length>=110?"…":""}</div>`;
  tip.style.display="block";tip.style.left=Math.max(4,Math.min(e.clientX+14,innerWidth-370))+"px";tip.style.top=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-8)+"px";});
 c.addEventListener("pointerleave",()=>{hover=-1;tip.style.display="none";draw();});});
document.querySelectorAll(".ph button").forEach(b=>b.onclick=()=>{const ci=+b.dataset.z,d=+b.dataset.d;
 if(!d){Z[ci].k=1;Z[ci].x=0;Z[ci].y=0;draw();}else zoomAt(ci,d>0?1.6:1/1.6);});
document.querySelectorAll("#lbl button").forEach(b=>b.onclick=()=>{labels=b.dataset.l==="on";document.querySelectorAll("#lbl button").forEach(x=>x.classList.toggle("on",x===b));draw();});
addEventListener("resize",()=>{GEO=[null,null];draw();});
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",draw);
draw();
</script></body></html>
